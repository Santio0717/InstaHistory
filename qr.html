<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InstaHistory — QR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg">

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <strong>InstaHistory</strong>
    <span class="muted">| QR</span>
  </div>
</header>

<main class="card wide qr-main">
  <h2 class="h2 h2-center">Escanea para continuar</h2>

  <div class="qrBox">

    <div id="qrcode"></div>

    <p class="muted small">
      Escanea el QR para abrir la experiencia en tu celular.
    </p>

    <a 
      class="link" 
      href="https://linktr.ee/sanagustin_experiencia" 
      target="_blank">
      Abrir contenido
    </a>

    <!-- BOTÓN SONIDO -->
    <button id="toggleSound" class="btn secondary" style="margin-top:15px;">
      🔊 Sonido activado
    </button>

  </div>
</main>

<audio id="bgSound" src="audio/fondo-qr.mp3" loop></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  const linktreeURL = "https://linktr.ee/sanagustin_experiencia";

  new QRCode(document.getElementById("qrcode"), {
    text: linktreeURL,
    width: 220,
    height: 220
  });

  const audio = document.getElementById("bgSound");
  const btn = document.getElementById("toggleSound");

  let isPlaying = true;

  window.addEventListener("load", () => {
    audio.volume = 0.3;
    audio.play().catch(()=>{});
  });

  document.addEventListener("click", () => {
    audio.play();
  }, { once: true });

  btn.addEventListener("click", () => {
    if(isPlaying){
      audio.pause();
      btn.textContent = "🔇 Sonido desactivado";
    } else {
      audio.play();
      btn.textContent = "🔊 Sonido activado";
    }
    isPlaying = !isPlaying;
  });
</script>

</body>
</html>
