  </main>

  <!-- Librería QR -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script type="module">
    import { logout } from "./js/state.js";

    document.getElementById("btnQrLogout")
      .addEventListener("click", () => logout());

    // 🔥 TU LINKTREE AQUÍ
    const linktreeURL = "https://linktr.ee/sanagustin_experiencia";

    // Generar QR
    new QRCode(document.getElementById("qrcode"), {
      text: linktreeURL,
      width: 220,
      height: 220
    });
  </script>
