<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>InstaHistory — QR</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg">

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <strong>InstaHistory</strong>
    <span class="muted">| QR</span>
  </div>

  <nav class="actions">
    <a class="btn secondary" href="experience.html">Volver</a>
  </nav>
</header>

<main class="card wide qr-main">
  <h2 class="h2 h2-center">Escanea para continuar</h2>

  <div class="qrBox">


<div id="qrcode"></div>

<p class="muted small">
  Escanea el QR para abrir la experiencia en tu celular.
</p>

<a class="link" href="https://linktr.ee/sanagustin_experiencia" target="_blank">
  Abrir contenido
</a>

<div style="margin-top:20px; text-align:center;">
  <button id="toggleSound" class="btn secondary">
    🔊 Sonido activado
  </button>

  <div style="margin-top:10px;">
    <input 
      type="range" 
      id="volumeControl" 
      min="0" 
      max="1" 
      step="0.1" 
      value="0.3"
      style="width:200px;">
  </div>
</div>


  </div>
</main>

<audio id="bgSound" src="audio/fondo-qr.mp3" loop></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  const linktreeURL = "https://linktr.ee/sanagustin_experiencia";

  new QRCode(document.getElementById("qrcode"), {
    text: linktreeURL,
    width: 220,
    height: 220
  });

  const audio = document.getElementById("bgSound");
  const btn = document.getElementById("toggleSound");
  const volumeControl = document.getElementById("volumeControl");

  let isPlaying = false;

  window.addEventListener("load", () => {
    audio.volume = 0.3;
    audio.play().then(() => {
      isPlaying = true;
    }).catch(()=>{});
  });

  document.addEventListener("click", () => {
    if(!isPlaying){
      audio.play();
      isPlaying = true;
    }
  }, { once: true });

  btn.addEventListener("click", () => {
    if(isPlaying){
      audio.pause();
      btn.textContent = "🔇 Sonido desactivado";
    } else {
      audio.play();
      btn.textContent = "🔊 Sonido activado";
    }
    isPlaying = !isPlaying;
  });

  volumeControl.addEventListener("input", (e) => {
    audio.volume = e.target.value;
  });
</script>

</body>
</html>
