<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>InstaHistory</title>

<link rel="stylesheet" href="css/styles.css">

<style>
#introOverlay{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
}

#introOverlay video{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body class="bg">

<!-- ===== VIDEO ===== -->
<div id="introOverlay">
  <video id="introVideo" autoplay muted playsinline>
    <source src="animacion/animacion-inicial.mp4" type="video/mp4">
  </video>
</div>

<script>
const video = document.getElementById("introVideo");

// 🔥 cuando termina → redirige
video.addEventListener("ended", () => {
  window.location.href = "preview.html";
});

// 🔥 fallback por si falla el evento
setTimeout(() => {
  window.location.href = "preview.html";
}, 10000);
</script>

</body>
</html>
