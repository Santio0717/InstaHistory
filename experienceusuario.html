<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>InstaHistory</title>
<link rel="stylesheet" href="css/styles.css">
<style>
#introOverlay {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
}

#introOverlay video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#postVideoActions {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 1.5rem;
  background: rgba(0, 0, 0, 0.7);
  animation: fadeInOverlay 0.6s ease;
}

@keyframes fadeInOverlay {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.post-video-btn {
  font-size: 1.3rem;
  padding: 0.9rem 2.8rem;
  border-radius: 2rem;
  border: none;
  cursor: pointer;
  font-weight: 700;
  letter-spacing: 0.05em;
  transition: transform 0.15s, box-shadow 0.15s;
}

.post-video-btn:hover,
.post-video-btn:focus {
  transform: scale(1.05);
  outline: none;
}

#btnReiniciarVideo {
  background: #1a2338;
  color: #a8b2d6;
  border: 2px solid #a8b2d6;
}

#btnContinuarVideo {
  background: #6aa9ff;
  color: #0b1020;
  box-shadow: 0 0 24px #6aa9ff88;
}
</style>
</head>

<body class="bg">

<div id="introOverlay">
  <video id="introVideo" autoplay muted playsinline>
    <source src="animacion/animacion-inicial.mp4" type="video/mp4">
  </video>
</div>

<div id="postVideoActions">
  <button class="post-video-btn" id="btnReiniciarVideo">🔁 Reiniciar</button>
  <button class="post-video-btn" id="btnContinuarVideo">▶️ Continuar</button>
</div>

<script src="js/videoIntro.js"></script>

</body>
</html>
